name: CI

on:
  pull_request:
    branches: [develop, "release/**", master]
  push:
    branches: ["feature/**", develop, "release/**", master]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # drift check diario, 06:00 UTC

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:

  fmt-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive

  # Roda em todo push/PR (exceto schedule), gratis, sem credencial AWS real - so
  # valida module.network (o unico modulo deste repo suportado pelo LocalStack;
  # EKS/RDS/DocumentDB/MQ nao sao emulados por ele). Serve de gate "dev" pra esse
  # repo: apply real contra AWS em dev e acao local do desenvolvedor (CLAUDE.md).
  validate-localstack:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:latest
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: |
          terraform apply -target=module.network \
            -var-file=envs/dev-local.tfvars -var="localstack_enabled=true" -auto-approve
      - run: |
          terraform destroy -target=module.network \
            -var-file=envs/dev-local.tfvars -var="localstack_enabled=true" -auto-approve

  # Security scan estatico. soft_fail: false -> achados HIGH/CRITICAL bloqueiam o job.
  tfsec:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: false

  # Plan-only para revisores verem o diff de infra ANTES do merge (EKS, RDS,
  # DocumentDB e MQ estao em jogo aqui). Comenta o output na PR.
  plan-hom-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: hom
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/hom-backend.hcl
      - run: terraform workspace select -or-create hom
      - run: terraform validate
      - name: Terraform Plan
        run: terraform plan -no-color -var-file=envs/hom.tfvars | tee plan-hom.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-comment: hom -->';
            let plan = fs.readFileSync('plan-hom.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncado)';
            }
            const body = `${marker}\n### Terraform Plan - hom\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  plan-prod-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/prod-backend.hcl
      - run: terraform workspace select -or-create prod
      - run: terraform validate
      - name: Terraform Plan
        run: terraform plan -no-color -var-file=envs/prod.tfvars | tee plan-prod.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-comment: prod -->';
            let plan = fs.readFileSync('plan-prod.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncado)';
            }
            const body = `${marker}\n### Terraform Plan - prod\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  open-pr-to-develop:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    needs: [fmt-check, validate-localstack, tfsec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abre PR feature -> develop (idempotente)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="${GITHUB_REF#refs/heads/}"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base develop --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" \
              --title "infra: ${BRANCH#feature/}" \
              --body "PR automatico apos pipeline 1 (fmt-check + validate-localstack + tfsec) passar."
          else
            echo "PR #$existing ja aberto $BRANCH -> develop, nada a fazer"
          fi

  open-pr-to-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [fmt-check, validate-localstack, tfsec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release ativa ou cria nova, abre PR develop -> release/N
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin 'refs/heads/release/*:refs/remotes/origin/release/*' --prune

          max_n=0
          active_n=""
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release/*'); do
            n="${ref##*/release/}"
            case "$n" in ''|*[!0-9]*) continue ;; esac
            [ "$n" -gt "$max_n" ] && max_n=$n
            if ! git merge-base --is-ancestor "origin/release/$n" origin/master; then
              if [ -n "$active_n" ]; then
                echo "::warning::mais de uma release ativa encontrada (release/$active_n e release/$n) - investigar manualmente"
              fi
              active_n=$n
            fi
          done

          if [ -n "$active_n" ]; then
            target="release/$active_n"
            echo "Reutilizando release ativa: $target"
          else
            target="release/$((max_n + 1))"
            git checkout -b "$target" origin/master
            git push origin "$target"
            echo "Nova release criada: $target"
          fi

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head develop --base "$target" --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$target" --head develop \
              --title "release: develop -> $target" \
              --body "PR automatico: consolida develop na release ativa."
          else
            echo "PR #$existing ja aberto develop -> $target, nada a fazer"
          fi

  validate-package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [fmt-check, validate-localstack, tfsec]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/prod-backend.hcl
      - run: terraform workspace select -or-create prod
      - run: terraform validate
      - name: Plan contra prod (validacao de pacote)
        run: |
          set +e
          terraform plan -var-file=envs/prod.tfvars -detailed-exitcode
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "::error::terraform plan falhou (codigo $code) validando pacote pra prod."
            exit 1
          fi

  open-pr-to-master:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: validate-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abre PR release/N -> master (idempotente)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="${GITHUB_REF#refs/heads/}"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base master --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
              --title "release: $BRANCH -> master" \
              --body "Pacote validado: terraform plan contra prod ok. Apply manual disponivel via apply.yml apos o merge."
          else
            echo "PR #$existing ja aberto $BRANCH -> master, nada a fazer"
          fi

  # Drift detection diario. Nao aplica nada - so falha ruidosamente se o
  # estado real divergir do codigo, pra alguem investigar manualmente.
  drift-detection:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [hom, prod]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_terraform
          aws-region: ${{ secrets.AWS_REGION }}
      - run: terraform init -backend-config=envs/${{ matrix.env }}-backend.hcl
      - run: terraform workspace select -or-create ${{ matrix.env }}
      - run: terraform validate

      - name: Plan drift - module.network
        id: plan_network
        run: |
          set +e
          terraform plan -detailed-exitcode -target=module.network -var-file=envs/${{ matrix.env }}.tfvars
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Plan drift - full stack
        id: plan_full
        run: |
          set +e
          terraform plan -detailed-exitcode -var-file=envs/${{ matrix.env }}.tfvars
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Fail loudly on drift
        if: steps.plan_network.outputs.exitcode == '2' || steps.plan_full.outputs.exitcode == '2'
        run: |
          echo "::error::DRIFT DETECTADO no ambiente ${{ matrix.env }}! O estado real da AWS diverge do codigo Terraform. Revise o plano acima antes de aplicar qualquer mudanca."
          exit 1

      - name: Fail loudly on plan error
        if: steps.plan_network.outputs.exitcode == '1' || steps.plan_full.outputs.exitcode == '1'
        run: |
          echo "::error::terraform plan falhou (erro, nao drift) no ambiente ${{ matrix.env }}."
          exit 1
